<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Oliver Bibby</title>
  <meta name="description"
    content="Professional correspondence with Oliver Bibby — Design Lead specialising in UX strategy and systems architecture." />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script type="module" src="/src/main.ts"></script>
</head>

<body>

  <!-- Decorative Glowing Background Mesh Blobs -->
  <div class="mesh-bg">
    <div class="blob blob--violet"></div>
    <div class="blob blob--blue"></div>
    <div class="blob blob--indigo"></div>
  </div>

  <!-- ── Floating Logo ── -->
  <div class="logo-fixed">
    <a href="/">
      <img src="/logo.svg" alt="Oliver Logo" class="logo-img" />
    </a>
  </div>

  <!-- ── Navigation (Floating Bottom Pill Dock) ── -->
  <nav class="nav" id="redesign-nav">
    <ul class="nav__links">
      <li><a href="/#about" class="nav-link-item">Home</a></li>
      <li><a href="/#work" class="nav-link-item">Case Studies</a></li>
      <li><a href="/contact.html" class="nav-link-item active">Contact</a></li>
    </ul>
  </nav>

  <!-- ── Contact Content (Centered) ── -->
  <section class="section contact-form-section">
    <div class="container" style="max-width: 800px; text-align: center;">

      <!-- Hero -->
      <div class="hero__inner" style="margin: 0 auto 64px; text-align: center;">
        <div class="hero__badge fade-up">
          <span class="badge-dot"></span>
          <span class="badge-text">Let's chat</span>
        </div>
        <h1 class="hero__headline h1 fade-up delay-1" style="margin-bottom: 24px;">
          Get in <span class="highlight-text font-serif">Contact</span>.
        </h1>
        <p class="hero__sub lead fade-up delay-2" style="margin: 0 auto; max-width: 640px;">
          I'm always available for a coffee to talk Design Systems, digital strategy or upskilling.
        </p>
      </div>

      <!-- Form Block -->
      <div id="form-wrap" class="service-card fade-up delay-3">


        <form id="contact-form">
          <!-- Hidden tag so every email is labelled from the website -->
          <input type="hidden" name="_subject" value="New enquiry from oliverbibby.com" />

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px;">
            <div class="form-group" style="margin-bottom: 0;">
              <label class="form-label">Name</label>
              <input type="text" name="name" id="field-name" placeholder="Name" required class="form-input" />
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label class="form-label">Email</label>
              <input type="email" name="email" id="field-email" placeholder="Email@example.com" required class="form-input" />
            </div>
          </div>
          <div style="margin-bottom: 24px;">
            <label class="form-label">Subject / Nature of Inquiry</label>
            <select name="subject" class="form-select">
              <option>Systems Strategy</option>
              <option>Institutional Architecture</option>
              <option>Product Governance</option>
              <option>Professional Dialogue / Coffee</option>
            </select>
          </div>
          <div style="margin-bottom: 40px;">
            <label class="form-label">Message</label>
            <textarea name="message" id="field-message" placeholder="The message..." required class="form-textarea"></textarea>
          </div>
          <!-- Validation error message -->
          <p id="form-error" style="display:none; margin-bottom: 16px; font-family: var(--font-sans); font-size: 0.95rem; color: #dc2626; text-align: center;"></p>
          <button type="submit" id="submit-btn" class="btn btn--primary" style="width: 100%; padding: 20px; font-size: 0.95rem; letter-spacing: 0.05em;">Send Message →</button>
        </form>

        <!-- Success state -->
        <div id="form-success" style="display:none; text-align: center; padding: 16px 0;">
          <div class="form-success-icon">✓</div>
          <h3 style="font-family: var(--font-sans); font-size: 1.4rem; font-weight: 600; color: var(--text-color); margin-bottom: 12px;">Message Sent</h3>
          <p style="font-family: var(--font-serif); font-size: 1.05rem; color: var(--text-muted); line-height: 1.6; max-width: 380px; margin: 0 auto 32px; font-style: italic;">Thanks for reaching out — I'll respond to your correspondence shortly.</p>
          <button onclick="resetForm()" style="font-family: var(--font-sans); font-size: 0.85rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; background: none; border: none; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px;">Send another message</button>
        </div>

      </div>

      <!-- Subtle Footer Detail -->
      <div class="fade-up delay-2" style="margin-top: 56px;">
        <p style="font-family: 'Newsreader', serif; font-size: 1.15rem; color: var(--accent); font-style: italic;">Based
          in Melbourne, Australia.</p>

      </div>

    </div>
  </section>



  <script>
    const form = document.getElementById('contact-form');
    const successEl = document.getElementById('form-success');
    const errorEl = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');

    const fields = [
      { el: document.getElementById('field-name'),    label: 'Name' },
      { el: document.getElementById('field-email'),   label: 'Email' },
      { el: document.getElementById('field-message'), label: 'Message' },
    ];

    // Clear red border as user types/inputs
    fields.forEach(({ el }) => {
      el.addEventListener('input', () => {
        if (el.value.trim()) el.style.borderColor = '';
      });
    });

    function validate() {
      const empty = fields.filter(({ el }) => !el.value.trim());
      empty.forEach(({ el }) => el.style.borderColor = '#dc2626');
      if (empty.length) {
        const labels = empty.map(f => f.label).join(', ');
        errorEl.textContent = `Please fill in the following fields: ${labels}.`;
        errorEl.style.display = 'block';
        return false;
      }
      // Basic email format check
      const emailEl = document.getElementById('field-email');
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailEl.value.trim());
      if (!emailOk) {
        emailEl.style.borderColor = '#dc2626';
        errorEl.textContent = 'Please enter a valid email address.';
        errorEl.style.display = 'block';
        return false;
      }
      return true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';

      if (!validate()) return;

      submitBtn.textContent = 'Sending...';
      submitBtn.disabled = true;

      try {
        const response = await fetch('https://formspree.io/f/xdapqvjo', {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          form.style.display = 'none';
          successEl.style.display = 'block';
        } else {
          const json = await response.json();
          const msg = json?.errors?.map(e => e.message).join(', ') || 'Something went wrong. Please try again.';
          errorEl.textContent = msg;
          errorEl.style.display = 'block';
          submitBtn.textContent = 'Send Message →';
          submitBtn.disabled = false;
        }
      } catch {
        errorEl.textContent = 'Network error. Please check your connection and try again.';
        errorEl.style.display = 'block';
        submitBtn.textContent = 'Send Message →';
        submitBtn.disabled = false;
      }
    });

    function resetForm() {
      form.reset();
      fields.forEach(({ el }) => el.style.borderColor = '');
      form.style.display = 'block';
      successEl.style.display = 'none';
      errorEl.style.display = 'none';
      submitBtn.textContent = 'Send Message →';
      submitBtn.disabled = false;
    }
  </script>

</body>

</html>
